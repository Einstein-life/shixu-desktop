name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Ensure electron path.txt
        shell: pwsh
        run: |
          $p = "node_modules/electron/path.txt"
          if (-not (Test-Path $p)) { Set-Content -Path $p -Value "electron.exe" -Encoding ascii }

      - name: Prepare portable
        shell: pwsh
        run: python scripts/sync_and_fix.py

      - name: Build installer
        run: npm run dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          # 可选：在仓库 Secrets 配置后自动签名
          # SHIXU_CERT_FILE: ${{ secrets.SHIXU_CERT_FILE }}
          # SHIXU_CERT_PASSWORD: ${{ secrets.SHIXU_CERT_PASSWORD }}

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release\时序调度-portable\*" -DestinationPath "release\时序调度-绿色版.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shixu-windows
          path: |
            release/时序调度-Setup-*.exe
            release/时序调度-绿色版.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/时序调度-Setup-*.exe
            release/时序调度-绿色版.zip
          generate_release_notes: true
