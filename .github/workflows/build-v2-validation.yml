name: Build v2 validation installers

on:
  push:
    branches: [codex/build-v2-installers]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run localize
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged source
        run: npm run verify:package -- "win/win-unpacked/resources/app.asar"
      - name: Check Windows installer and run packaged app
        shell: pwsh
        run: |
          $installer=Get-ChildItem win -Filter 'Shixu-Desktop-*-win-x64.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer missing' }
          if ($installer.Length -lt 1000000) { throw 'Installer is unexpectedly small' }
          $bytes=[System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Installer is not a Windows executable' }
          $app=Join-Path (Get-Location) 'win/win-unpacked/Shixu Desktop.exe'
          if (!(Test-Path -LiteralPath $app)) { throw 'Packaged executable missing' }
          node scripts/smoke-desktop.cjs $app win
          if ($LASTEXITCODE -ne 0) { throw 'Installed-app startup smoke failed' }
          node scripts/verify-packages.cjs (Join-Path (Get-Location) 'win/win-unpacked/resources/app.asar')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged source mismatch' }
          $portable=Join-Path $env:RUNNER_TEMP 'shixu-portable-check'
          Copy-Item -LiteralPath (Join-Path (Get-Location) 'win/win-unpacked') -Destination $portable -Recurse -Force
          node scripts/smoke-desktop.cjs (Join-Path $portable 'Shixu Desktop.exe') win
          if ($LASTEXITCODE -ne 0) { throw 'Portable startup smoke failed' }
      - run: npm run checksums -- win
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shixu-v2-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            win/*.exe
            win/*.blockmap
            win/SHA256SUMS.txt
            win/package-verification.json
            win/startup-smoke.json

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run localize
      - run: npm run check
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify source, signatures and archives
        shell: bash
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' app; do
            if ! codesign --verify --deep --strict --verbose=2 "$app" 2>codesign-error.txt; then
              if grep -q 'code object is not signed at all' codesign-error.txt; then
                echo "Unsigned development artifact accepted; Developer ID signing and notarization are release steps."
              else
                cat codesign-error.txt
                exit 1
              fi
            fi
            archives+=("$app/Contents/Resources/app.asar")
            lipo -archs "$app/Contents/MacOS/Shixu Desktop"
          done < <(find mac -maxdepth 3 -name 'Shixu Desktop.app' -type d -print0)
          test "${#archives[@]}" -eq 2
          npm run verify:package -- "${archives[@]}"
          for file in mac/*.dmg; do hdiutil verify "$file"; done
          for file in mac/*.zip; do unzip -tq "$file"; done
      - run: npm run checksums -- mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shixu-v2-macos
          if-no-files-found: error
          retention-days: 30
          path: |
            mac/*.dmg
            mac/*.zip
            mac/*.blockmap
            mac/SHA256SUMS.txt
            mac/package-verification.json
            mac/startup-smoke.json
