name: Build Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Ensure electron path.txt
        shell: pwsh
        run: |
          $p = "node_modules/electron/path.txt"
          if (-not (Test-Path $p)) { Set-Content -Path $p -Value "electron.exe" -Encoding ascii }

      - name: Prepare portable
        shell: pwsh
        run: python scripts/sync_and_fix.py

      - name: Build Windows installer
        run: npm run dist:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release\时序调度-portable\*" -DestinationPath "release\shixu-Portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shixu-windows
          path: |
            release/时序调度-Setup-*.exe
            release/shixu-Portable.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon (icns)
        run: node scripts/make-icns.js

      - name: Build macOS DMG/ZIP
        run: npm run dist:mac
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shixu-macos
          path: |
            release/Shixu-Desktop-*-mac-*.dmg
            release/Shixu-Desktop-*-mac-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
