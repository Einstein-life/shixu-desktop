name: Release v1.1.0 desktop packages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.1.0
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run localize
      - run: npm run check
      - run: npm test
      - name: Build the Windows installer with internal version 1.1.0
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Install and verify version, source, startup and retained records
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installDir=Join-Path $env:RUNNER_TEMP 'shixu-release-install'
          $profileDir=Join-Path $env:RUNNER_TEMP 'shixu-retained-profile'
          $installer=(Resolve-Path -LiteralPath win/Shixu-Desktop-1.1.0-win-x64.exe).Path
          $install=Start-Process -FilePath $installer -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe=Join-Path $installDir 'Shixu Desktop.exe'
          for ($attempt=0; $attempt -lt 40 -and !(Test-Path -LiteralPath $exe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (!(Test-Path -LiteralPath $exe)) { throw 'Installed executable missing at the requested NSIS destination' }
          $fileVersion=(Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if ($fileVersion -notmatch '^1\.1\.0(?:\.|$)') { throw "Unexpected installed version: $fileVersion" }
          node scripts/verify-packages.cjs (Join-Path $installDir 'resources/app.asar')
          if ($LASTEXITCODE -ne 0) { throw 'Installed source mismatch' }
          node scripts/smoke-desktop.cjs $exe win
          if ($LASTEXITCODE -ne 0) { throw 'Fresh startup failed' }
          node scripts/smoke-upgrade.cjs prepare $profileDir
          if ($LASTEXITCODE -ne 0) { throw 'Fixture preparation failed' }
          node scripts/smoke-upgrade.cjs check $exe $profileDir win/preserved-data-win-x64.json
          if ($LASTEXITCODE -ne 0) { throw 'Record retention failed' }
          $env:ELECTRON_RUN_AS_NODE=$null
          $probe=(Resolve-Path -LiteralPath scripts/smoke-autostart.cjs).Path
          $runtime=(Resolve-Path -LiteralPath node_modules/electron/dist/electron.exe).Path
          $archive=Join-Path $installDir 'resources/app.asar'
          $report=Join-Path (Get-Location) 'win/native-autostart-win-x64.json'
          $process=Start-Process -FilePath $runtime -ArgumentList @($probe,('"'+$exe+'"'),('"'+$archive+'"'),$report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged autostart check failed' }
          Move-Item -LiteralPath win/package-verification.json -Destination win/package-verification-win-x64.json
          Move-Item -LiteralPath win/startup-smoke.json -Destination win/startup-smoke-win-x64.json
          @{installedVersion=$fileVersion;syntheticRecordsRetained=$true;checkedAt=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Set-Content win/installer-validation-win-x64.json
      - name: Attach verified Windows package and reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-checksums.cjs win
          mv win/SHA256SUMS.txt win/SHA256SUMS-win-x64.txt
          gh release view v1.1.0 --json isDraft,targetCommitish > existing-release.json
          node -e "const r=require('./existing-release.json');if(!r.isDraft||r.targetCommitish!==process.env.GITHUB_SHA)throw Error('Release does not match build commit')"
          gh release upload v1.1.0 win/*-win-x64.* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-v1.1.0-validation
          path: |
            win/*.json
            win/*.txt

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            app_dir: mac
            mach_arch: x86_64
          - runner: macos-15
            arch: arm64
            app_dir: mac-arm64
            mach_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run localize
      - run: npm run check
      - run: npm test
      - run: node scripts/make-icns.js
      - name: Build native macOS DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          node -e "if(process.arch!=='${{ matrix.arch }}')throw Error('Native runner architecture mismatch')"
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.directories.output=mac
      - name: Verify packaged version, source, signature, startup and retained records
        run: |
          set -euo pipefail
          APP="mac/${{ matrix.app_dir }}/Shixu Desktop.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '1.1.0'
          /usr/bin/lipo "$APP/Contents/MacOS/Shixu Desktop" -verify_arch ${{ matrix.mach_arch }}
          codesign --verify --deep --strict "$APP"
          node scripts/verify-packages.cjs "$APP/Contents/Resources/app.asar"
          node scripts/smoke-desktop.cjs "$APP/Contents/MacOS/Shixu Desktop" mac
          PROFILE="$RUNNER_TEMP/shixu-retained-profile"
          node scripts/smoke-upgrade.cjs prepare "$PROFILE"
          node scripts/smoke-upgrade.cjs check "$APP/Contents/MacOS/Shixu Desktop" "$PROFILE" mac/preserved-data-mac-${{ matrix.arch }}.json
          hdiutil verify mac/Shixu-Desktop-1.1.0-mac-${{ matrix.arch }}.dmg
          unzip -tq mac/Shixu-Desktop-1.1.0-mac-${{ matrix.arch }}.zip
          mv mac/package-verification.json mac/package-verification-mac-${{ matrix.arch }}.json
          mv mac/startup-smoke.json mac/startup-smoke-mac-${{ matrix.arch }}.json
      - name: Verify transparent renderer pixels and native geometry
        run: |
          set -euo pipefail
          APP="mac/${{ matrix.app_dir }}/Shixu Desktop.app"
          env -u ELECTRON_RUN_AS_NODE node_modules/electron/dist/Electron.app/Contents/MacOS/Electron scripts/smoke-dock-transparency.cjs "$APP/Contents/Resources/app.asar" "mac/native-transparency-mac-${{ matrix.arch }}.json"
      - name: Verify visible floating-ball transparency on the desktop
        run: |
          set -euo pipefail
          APP="mac/${{ matrix.app_dir }}/Shixu Desktop.app"
          env -u ELECTRON_RUN_AS_NODE node_modules/electron/dist/Electron.app/Contents/MacOS/Electron scripts/smoke-dock-compositor.cjs "$APP" "mac/desktop-compositor-mac-${{ matrix.arch }}.json"
      - name: Attach verified macOS packages and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shasum -a 256 mac/Shixu-Desktop-1.1.0-mac-${{ matrix.arch }}.dmg mac/Shixu-Desktop-1.1.0-mac-${{ matrix.arch }}.zip | sed 's|mac/||' > mac/SHA256SUMS-mac-${{ matrix.arch }}.txt
          gh release view v1.1.0 --json isDraft,targetCommitish > existing-release.json
          node -e "const r=require('./existing-release.json');if(!r.isDraft||r.targetCommitish!==process.env.GITHUB_SHA)throw Error('Release does not match build commit')"
          gh release upload v1.1.0 mac/*-mac-${{ matrix.arch }}.* mac/*-mac-${{ matrix.arch }}-*.png --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-v1.1.0-validation
          path: |
            mac/*.json
            mac/*.txt
            mac/*.png
            mac/builder-debug.yml
