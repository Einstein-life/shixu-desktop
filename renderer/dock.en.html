<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shixu floating panel</title>
  <script src="locale.js"></script>
  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <script src="research-core.js"></script>
  <script src="lab-core.js"></script>
  <script src="dock-layout.js"></script>
  <link rel="stylesheet" href="lab.css">
  <style>
    :root {
      --chrome:#0F141A; --chrome2:#1A2330; --paper:#EEF2F6; --card:#fff;
      --ink:#16202C; --muted:#7B8798; --line:#D5DCE5;
      --now:#D64532; --today:#C47A0A; --week:#1F7A70; --deep:#3D4DB7; --ok:#2F8F5C;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
      background:transparent; color:var(--ink); user-select:none;
    }
    #shell {
      width:100%; height:100%;
      background:var(--chrome);
      border:1px solid #243041;
      border-radius:12px;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    #shell.has-now { background:#2A0F0C; border-color:#5A2018; }
    .drag { -webkit-app-region: drag; }
    .nodrag { -webkit-app-region: no-drag; }
    .top {
      display:flex; align-items:center; gap:8px;
      padding:8px 10px 6px;
    }
    .badge {
      font-family:"Segoe UI",sans-serif; font-weight:700; font-size:11px;
      color:#fff; padding:3px 8px; border-radius:6px; background:#8B1E14;
    }
    .badge.now { background:#C62828; font-size:12px; }
    .badge.today { background:var(--today); }
    .badge.wait { background:#3D4DB7; }
    .badge.ready { background:#9F1239; }
    .spacer { flex:1; }
    .hint { color:#6B7A90; font-size:11px; }
    .btn {
      border:none; border-radius:6px; padding:3px 8px; font-size:12px;
      cursor:pointer; color:#fff; background:var(--chrome2);
    }
    .btn:hover { filter:brightness(1.1); }
    .body { flex:1; overflow:auto; padding:2px 10px 10px; }
    .line {
      padding:4px 6px; margin-bottom:4px; border-radius:6px;
      font-size:12px; line-height:1.35; word-break:break-word;
    }
    .line.now { background:#2A0F0C; color:#FF8A7A; font-weight:700; font-size:13px; }
    .line.ready { background:#3A1018; color:#FFB4A8; font-weight:700; }
    .line.wait { background:#152040; color:#9BB0FF; font-weight:700; }
    .line.today { background:#2A2010; color:#FFD28A; font-weight:700; }
    .line.other { background:#121A26; color:#C5D0DC; }
    .empty { color:#9AABBC; font-size:13px; padding:12px 6px; }
    .panel { display:none; height:100%; min-height:0; flex:1 1 0; flex-direction:column; }
    .panel.open { display:flex; }
    .slots { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:0 10px 8px; }
    .slot {
      border:1px solid #2A3850; background:#121A26; color:#C5D0DC;
      border-radius:8px; min-height:32px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .slot.on { background:#2A3F8F; border-color:#5B6FD4; color:#fff; }
    .rec {
      margin:0 10px 8px; padding:8px 10px; border-radius:8px;
      background:#0F1A2E; color:#C8D8FF; font-size:12px; line-height:1.4;
    }
    .rec.urgent { background:#2A0F0C; color:#FFD0C8; font-weight:700; }
    .cards { flex:1; min-height:0; overflow:auto; padding:0 8px 8px; }
    .top,.slots,.rec,.foot,.lab-dock-alert { flex-shrink:0; }
    .card {
      background:#121A26; border:1px solid #243041; border-left:4px solid var(--muted);
      border-radius:8px; padding:8px 10px; margin-bottom:6px;
    }
    .card.now { border-left-color:var(--now); background:#FFF1EF; }
    .card.ready { border-left-color:#9F1239; background:#FFF0F3; }
    .card.wait { border-left-color:#3D4DB7; background:#EEF0FA; }
    .card.title-dark { color:var(--ink); }
    .card .t { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:4px; word-break:break-word; }
    .card.now .t { color:#9F1239; font-size:14px; }
    .card.ready .t { color:#9F1239; }
    .card.wait .t { color:#2A3F8F; }
    .meta { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
    .chip {
      font-size:10px; padding:2px 6px; border-radius:999px; background:#EBEFF4; color:#3D4A5C;
    }
    .chip.hot { background:#FCEBE8; color:#D64532; }
    .chip.blue { background:#EEF0FA; color:#3D4DB7; }
    .acts { display:flex; flex-wrap:wrap; gap:4px; }
    .acts button {
      border:none; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer;
      background:#EBEFF4; color:#16202C;
    }
    .acts button.primary { background:#3D4DB7; color:#fff; }
    .acts button.danger { background:#D64532; color:#fff; }
    .acts button.warn { background:#FFD6D0; color:#9F1239; }
    .foot {
      display:flex; gap:6px; padding:8px 10px; border-top:1px solid #243041;
    }
    .foot button {
      flex:1; border:none; border-radius:8px; min-height:34px; font-size:12px;
      cursor:pointer; background:var(--chrome2); color:#fff; font-weight:600;
    }
    .foot button.primary { background:#2A3F8F; }

    /* 贴边篮球：只显示球，无方块面板 */
    #ballWrap {
      display:none;
      width:40px; height:40px;
      align-items:center; justify-content:center;
      background:transparent;
    }
    #shell.ball-only {
      background:transparent;
      border:none;
      box-shadow:none;
    }
    #shell.ball-only #collapsed,
    #shell.ball-only #expanded {
      display:none !important;
    }
    #shell.ball-only #ballWrap {
      display:flex;
    }
    .bb {
      width:32px; height:32px; border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, #E89058 0 18%, transparent 19%),
        #D4682E;
      border:1px solid #8B3A18;
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }
    .bb::before,
    .bb::after {
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
    }
    .bb::before {
      background:
        linear-gradient(to right, transparent 47%, #2A1A12 47%, #2A1A12 53%, transparent 53%),
        linear-gradient(to bottom, transparent 47%, #2A1A12 47%, #2A1A12 53%, transparent 53%);
    }
    .bb::after {
      border:1.5px solid #2A1A12;
      clip-path: inset(0 0 0 0);
      background:
        radial-gradient(circle at 50% 50%, transparent 58%, #2A1A12 59%, #2A1A12 61%, transparent 62%);
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="ballWrap" title="Click to expand">
      <div class="bb" id="bb"></div>
    </div>
    
    <div id="collapsed" class="panel open">
      <div class="top drag">
        <span class="badge now nodrag" id="badgeNow">Now 0</span>
        <span class="badge today nodrag" id="badgeToday">Today 0</span>
        <span class="spacer"></span>
        <button class="btn nodrag" data-lang-toggle title="Language">EN / 中文</button>
        <button class="btn nodrag" id="btnMode" title="Display mode">Always visible</button>
        <button class="btn nodrag" id="btnExpand" title="Expand">＋</button>
        <button class="btn nodrag" id="btnClose" title="Quit">×</button>
      </div>
      <div class="body nodrag" id="peekBody">
        <div class="empty">Click to open schedule…</div>
      </div>
    </div>

    
    <div id="expanded" class="panel">
      <div class="top drag">
        <strong style="color:#F4F7FA;font-size:13px">Shixu · Research Scheduler</strong>
        <span class="hint nodrag">⠿ Draggable</span>
        <span class="spacer"></span>
        <button class="btn nodrag" data-lang-toggle title="Language">EN / 中文</button>
        <button class="btn nodrag" id="btnMode2">Always visible</button>
        <button class="btn nodrag" id="btnCollapse">—</button>
      </div>
      <div class="slots nodrag" id="slots"></div>
      <div class="rec nodrag" id="rec">Choose a time block to see what fits</div>
      <div class="cards nodrag" id="cards"></div>
      <div class="foot nodrag">
        <button id="btnMain">Open Shixu</button>
        <button id="btnAddTime" class="primary">+30 min</button>
        <button id="btnReload">Refresh</button>
      </div>
    </div>
  </div>

  <script>
    const L = (zh,en) => document.documentElement.lang === "en" ? en : zh;
    const SLOT_LABELS = { "15":L("≤15分","≤15 min"), "30":L("30分","30 min"), "60":L("1小时","1 hour"), "120":L("2小时+","2+ hours") };
    const CATS = {
      wetlab:L("湿实验","Wet lab"), analysis:L("分析","Analysis"), paper:L("写文章","Writing"), project:L("写项目","Project work"),
      literature:L("文献","Literature"), meeting:L("会议","Meeting"), admin:L("杂务","Admin")
    };
    const DL = {
      overdue:L("已超期","Overdue"), today:L("今天","Today"), tomorrow:L("明天","Tomorrow"),
      three_days:L("3天内","Within 3 days"), this_week:L("本周","This week"), later:L("更晚","Later")
    };

    let state = null;
    let expanded = false;

    function $(id){ return document.getElementById(id); }

    function computeScore(t) {
      const urgency = {overdue:12,today:10,tomorrow:8,three_days:6,this_week:4,later:2}[t.deadline] || 2;
      const impact = {severe:5,others:4,mild:2,none:0}[t.impact] ?? 2;
      const flex = {only_me:2,partial:0,deferrable:-2,drop:-4}[t.flex] || 0;
      let s = urgency + impact + flex;
      const deep = t.focus === "deep" || (!t.focus && ["analysis","paper","project"].includes(t.cat));
      if (deep && ["today","overdue","tomorrow"].includes(t.deadline)) s += 2;
      return Math.max(0, Math.min(22, s));
    }

    function normalize(data) {
      const tasks = (data.tasks || []).map((t, i) => ({
        ...t,
        id: LabCore.cleanId(t.id),
        title: t.title || L("未命名","Untitled task"),
        cat: CATS[t.cat] ? t.cat : "admin",
        deadline: DL[t.deadline] ? t.deadline : "later",
        run_state: ["waiting","ready"].includes((t.run_state||"").toLowerCase()) && !t.done
          ? t.run_state.toLowerCase() : "",
        score: Number(t.score) || computeScore(t),
        done: !!t.done,
        time_spent: Number(t.time_spent) || 0,
        progress: Number(t.progress) || (t.done ? 100 : 0)
      }));
      return {
        ...data,
        experiments: data.experiments || [],
        version: 4,
        slot: data.slot || "60",
        capacity_hours: data.capacity_hours || 6,
        projects: data.projects || [],
        tasks,
        summaries: data.summaries || []
      };
    }

    function activeTasks() {
      return (state.tasks || []).filter((t) => !t.done)
        .sort((a,b) => (b.score||0) - (a.score||0) || (a.createdAt||0)-(b.createdAt||0));
    }

    function parallelTasks() {
      return activeTasks().filter((t) => !t.run_state);
    }

    function effortFit(t, slot) {
      if (!slot) return true;
      const hours = {m15:0.25,m30:0.5,h1:1,h2:2,half:3.5,day:8}[t.effort] || 1;
      return hours * 60 <= parseInt(slot,10) + 1;
    }

    function save() {
      if (window.shixu && state) {
        return window.shixu.save(state);
      }
      return Promise.resolve(state);
    }

    function renderBadges() {
      const act = activeTasks();
      const now = act.filter((t) => !t.run_state && t.score >= 12).length;
      const today = act.filter((t) => !t.run_state && t.score >= 9 && t.score < 12).length;
      const waiting = act.filter((t) => t.run_state === "waiting").length;
      const ready = act.filter((t) => t.run_state === "ready").length;
      const bn = $("badgeNow"), bt = $("badgeToday");
      bn.textContent = L("立刻 ","Now ") + now;
      bn.className = "badge nodrag" + (now ? " now" : "");
      if (ready) { bt.textContent = L("待处理 ","Review ") + ready; bt.className = "badge nodrag ready"; }
      else if (waiting) { bt.textContent = L("等待 ","Waiting ") + waiting; bt.className = "badge nodrag wait"; }
      else { bt.textContent = L("今日 ","Today ") + today; bt.className = "badge nodrag today"; }

      const shell = $("shell");
      shell.classList.toggle("has-now", now > 0 || ready > 0);
    }

    function renderPeek() {
      const act = activeTasks();
      const ready = act.filter((t) => t.run_state === "ready");
      const waiting = act.filter((t) => t.run_state === "waiting");
      const parallel = act.filter((t) => !t.run_state);
      const html = [];
      ready.slice(0,2).forEach((t) => html.push(`<div class="line ready">${L("【处理结果】","Review results: ")}<span data-user-copy>${esc(t.title)}</span></div>`));
      if (waiting.length) {
        html.push(`<div class="line wait">⏳ ${L("等待 ","Waiting ")}${waiting.length}${L(" 项 · 人可并行"," · you can work in parallel")}</div>`);
      }
      parallel.slice(0,3).forEach((t) => {
        const cls = t.score >= 12 ? "now" : (t.score >= 9 ? "today" : "other");
        const prefix = t.score >= 12 ? L("【立刻】","Do now: ") : (t.score >= 9 ? L("［今日］","Today: ") : L("【可并行】","Parallel: "));
        html.push(`<div class="line ${cls}">${prefix}<span data-user-copy>${esc(t.title)}</span></div>`);
      });
      $("peekBody").innerHTML = html.length ? html.join("") : `<div class="empty">${L("今日已清空","No tasks for today")}<br/>${L("展开后可录入（在完整视图）","Open the full view to add tasks")}</div>`;
    }

    function renderSlots() {
      const slot = state.slot || "60";
      $("slots").innerHTML = Object.entries(SLOT_LABELS).map(([k,label]) =>
        `<button type="button" class="slot nodrag ${k===slot?"on":""}" data-slot="${k}">${label}</button>`
      ).join("");
    }

    function renderRec() {
      const act = activeTasks();
      const ready = act.filter((t) => t.run_state === "ready");
      const waiting = act.filter((t) => t.run_state === "waiting");
      const poolAll = act.filter((t) => !t.run_state);
      const slot = state.slot;
      let pool = poolAll.filter((t) => effortFit(t, slot) && (t.score||0) >= 4);
      if (!pool.length) pool = poolAll;
      const parts = [];
      if (ready.length) parts.push(L("结果已到：","Results ready: ") + ready[0].title);
      if (waiting.length) parts.push(L("等待中 ","Waiting: ") + waiting.length + L(" 项，人可并行"," · work can continue"));
      if (pool.length) parts.push((waiting.length || ready.length ? L("并行建议：","Parallel suggestion: ") : L("现在建议：","Suggested now: ")) + pool[0].title);
      const rec = $("rec");rec.setAttribute("data-user-copy", "");
      rec.textContent = parts.length ? parts.join(" · ") : L("暂无待办，可到完整视图录入","No open tasks. Add one in the full view.");
      rec.classList.toggle("urgent", !!ready.length || (pool[0] && pool[0].score >= 12 && !waiting.length));
    }

    function renderCards() {
      const act = activeTasks();
      const ready = act.filter((t) => t.run_state === "ready");
      const waiting = act.filter((t) => t.run_state === "waiting");
      const parallel = act.filter((t) => !t.run_state);
      const items = [...ready, ...waiting, ...parallel].slice(0, 8);
      if (!items.length) {
        $("cards").innerHTML = `<div class="empty">没有待办</div>`;
        return;
      }
      $("cards").innerHTML = items.map((t) => {
        const cls = t.run_state === "ready" ? "ready" : t.run_state === "waiting" ? "wait" : (t.score >= 12 ? "now" : "");
        const chips = [
          CATS[t.cat] || t.cat,
          DL[t.deadline] || t.deadline,
          L("分 ","Score ") + t.score,
          L("工时 ","Hours ") + t.time_spent + "h",
          L("进度 ","Progress ") + (t.done ? 100 : t.progress) + "%"
        ];
        if (t.run_state === "waiting") chips.push(L("机器运行中","Run in progress"));
        if (t.run_state === "ready") chips.push(L("待处理结果","Results ready for review"));
        return `<div class="card ${cls} title-dark" data-id="${esc(t.id)}">
          <div class="t" data-user-copy>${esc(t.title)}</div>
          <div class="meta">${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
          <div class="acts">
            ${t.run_state === "waiting" ? `
              <button class="primary" data-act="run" data-rs="ready">${L("结果已到","Results ready")}</button>
              <button data-act="run" data-rs="">${L("取消等待","Cancel wait")}</button>` : ""}
            ${t.run_state === "ready" ? `
              <button class="danger" data-act="done">${L("处理完成","Mark reviewed")}</button>
              <button data-act="run" data-rs="">${L("仍需跟进","Needs follow-up")}</button>` : ""}
            ${!t.run_state ? `
              <button class="warn" data-act="run" data-rs="waiting">${L("提交等待","Mark as waiting")}</button>
              <button data-act="time" data-h="0.25">+15 ${L("分","min")}</button>
              <button data-act="time" data-h="0.5">+30 ${L("分","min")}</button>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function renderLabAlerts() {
      document.querySelectorAll('.lab-dock-alert').forEach(e => e.remove());
      const running = (state.experiments || []).map(e => ({e,s:LabCore.currentStep(e)})).filter(x=>x.s?.status==='running').sort((a,b)=>Date.parse(a.s.dueAt)-Date.parse(b.s.dueAt));
      if (!running.length) return;
      const {e,s} = running[0], t = LabCore.timing(s);
      const text = (t.remaining>0 ? L('下一实验接手：','Next lab action: ') : L('实验已到时：','Lab step due: ')) + e.title + ' / ' + s.title + ' · ' + Math.ceil(Math.abs(t.remaining)/60000) + ' min';
      for (const id of ['collapsed','expanded']) {
        const alert=document.createElement('div');alert.className='lab-dock-alert';alert.textContent=text;alert.setAttribute('data-user-copy','');
        alert.onclick=()=>window.shixu?.openLab();
        const panel=document.getElementById(id);
        const target=id==='collapsed'?$('peekBody'):panel.querySelector('.slots');
        target.before(alert);
      }
    }

    function render() {
      if (!state) return;
      renderBadges();
      renderPeek();
      renderSlots();
      renderRec();
      renderCards();
      renderLabAlerts();
    }

    const dockLayout = window.DockLayout?.createDockLayoutController(() => window.shixu || {});

    async function setExpanded(v) {
      expanded = !!v;
      if (expanded) {
        edgeHidden = false;
        document.getElementById("shell").classList.remove("ball-only");
      }
      const targetExpanded = expanded;
      $("collapsed").classList.toggle("open", !expanded);
      $("expanded").classList.toggle("open", expanded);
      if (dockLayout) await dockLayout.resize(targetExpanded);
      else if (window.shixu && window.shixu.dockSetSize) await window.shixu.dockSetSize(targetExpanded);
    }

    let displayMode = "always";
    let edgeHidden = false;
    let homePos = null;

    function modeLabel() {
      return displayMode === "always" ? L("常显","Always") : L("贴边","Edge");
    }

    function paintMode() {
      const t = modeLabel();
      if ($("btnMode")) $("btnMode").textContent = t;
      if ($("btnMode2")) $("btnMode2").textContent = t;
    }

    async function setDisplayMode(mode) {
      displayMode = mode === "edge" ? "edge" : "always";
      paintMode();
      if (window.shixu && window.shixu.dockDisplayMode) {
        await window.shixu.dockDisplayMode(displayMode);
      }
      if (displayMode === "always") {
        await showFromEdge(true);
      } else {
        setTimeout(hideToEdge, 500);
      }
    }

    async function hideToEdge() {
      if (displayMode !== "edge" || expanded || edgeHidden) return;
      edgeHidden = true;
      if (dockLayout) await dockLayout.hide();
      else if (window.shixu && window.shixu.dockSetBall) await window.shixu.dockSetBall(true);
      if (!expanded && displayMode === "edge" && edgeHidden) document.getElementById("shell").classList.add("ball-only");
    }

    async function showFromEdge(force) {
      if (!edgeHidden && !force) return;
      edgeHidden = false;
      document.getElementById("shell").classList.remove("ball-only");
      if (dockLayout) await dockLayout.show(homePos);
      else if (window.shixu && window.shixu.dockSetBall) await window.shixu.dockSetBall(false);
      if (!dockLayout && window.shixu && window.shixu.dockSlide && homePos) await window.shixu.dockSlide({ mode: "show", x: homePos.x, y: homePos.y });
    }

    async function toggleMode() {
      await setDisplayMode(displayMode === "always" ? "edge" : "always");
    }

    $("btnMode") && $("btnMode").addEventListener("click", toggleMode);
    $("btnMode2") && $("btnMode2").addEventListener("click", toggleMode);
    $("bb") && $("bb").addEventListener("click", () => { void setExpanded(true); });

    let hoverCount = 0;
    let lastHoverTs = Date.now();
    document.getElementById("shell").addEventListener("mouseenter", () => {
      hoverCount += 1;
      lastHoverTs = Date.now();
      if (displayMode === "edge" && edgeHidden) void showFromEdge(false);
    });
    document.getElementById("shell").addEventListener("mouseleave", () => {
      hoverCount = Math.max(0, hoverCount - 1);
    });

    setInterval(() => {
      if (displayMode !== "edge") return;
      const over = hoverCount > 0;
      if (over) {
        if (edgeHidden) showFromEdge(true);
        lastHoverTs = Date.now();
      } else if (!expanded && Date.now() - lastHoverTs > 900) {
        hideToEdge();
      }
    }, 250);

    async function init() {
      if (window.shixu) {
        state = normalize(await window.shixu.load());
        window.shixu.onUpdate((data) => {
          state = normalize(data || {});
          render();
        });
        try {
          const m = await window.shixu.dockGetDisplayMode();
          displayMode = (m && m.displayMode === "edge") ? "edge" : "always";
        } catch (_) {}
      } else if (new URLSearchParams(location.search).get("demo") === "1") {
        state = normalize({
          slot: "60",
          tasks: [
            { id: "t1", title: "完成 DMR 与 DEG 关联主图（等服务器结果）", cat: "analysis", deadline: "today", score: 18, run_state: "waiting", time_spent: 1, progress: 40 },
            { id: "t2", title: "改论文 Results 第三段与图注", cat: "paper", deadline: "three_days", score: 14, time_spent: 0.5, progress: 20 },
            { id: "t3", title: "组会汇报：准备 3 页进度", cat: "meeting", deadline: "today", score: 12, time_spent: 0, progress: 0 },
            { id: "t4", title: "扫 5 篇甲基化 + TE 新文献摘要", cat: "literature", deadline: "this_week", score: 3, time_spent: 0, progress: 0 }
          ],
          projects: []
        });
      } else {
        state = normalize({ tasks: [], projects: [] });
      }
      paintMode();
      render();
      await setExpanded(new URLSearchParams(location.search).get("expanded") === "1");
    }

    $("btnExpand").addEventListener("click", () => { void setExpanded(true); });
    $("btnCollapse").addEventListener("click", () => { void setExpanded(false); });
    $("btnClose").addEventListener("click", () => {
      if (window.shixu) window.shixu.hideDock();
    });
    $("btnMain").addEventListener("click", () => {
      if (window.shixu) window.shixu.openMain();
    });
    $("btnReload").addEventListener("click", async () => {
      if (window.shixu) state = normalize(await window.shixu.load());
      render();
    });
    $("btnAddTime").addEventListener("click", async () => {
      const t = activeTasks().filter((x) => !x.run_state)[0];
      if (!t) return;
      t.time_spent = Math.round(((Number(t.time_spent)||0) + 0.5) * 100) / 100;
      state.tasks = state.tasks.map((x) => x.id === t.id ? t : x);
      await save();
      render();
    });

    $("slots").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-slot]");
      if (!b) return;
      const v = b.getAttribute("data-slot");
      state.slot = state.slot === v ? "60" : v;
      await save();
      render();
    });

    $("cards").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const card = btn.closest("[data-id]");
      if (!card) return;
      const id = card.getAttribute("data-id");
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      const act = btn.getAttribute("data-act");
      if (act === "time") {
        t.time_spent = Math.round(((Number(t.time_spent)||0) + Number(btn.getAttribute("data-h"))) * 100) / 100;
      } else if (act === "done") {
        t.done = true; t.progress = 100; t.run_state = "";
        t.completedAt = new Date().toISOString();
      } else if (act === "run") {
        const rs = btn.getAttribute("data-rs") || "";
        t.run_state = ["waiting","ready"].includes(rs) ? rs : "";
        if (t.run_state === "waiting") t.done = false;
      }
      state.tasks = state.tasks.map((x) => x.id === t.id ? t : x);
      await save();
      render();
    });

    // click empty collapsed body expands
    $("peekBody").addEventListener("click", (e) => {
      if (!e.target.closest("button")) void setExpanded(true);
    });

    setInterval(() => { if (state) renderLabAlerts(); }, 1000);
    init();
  </script>
</body>
</html>
